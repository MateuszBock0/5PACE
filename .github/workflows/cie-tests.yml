name: CIE checks
on:
  pull_request:
    paths:
      - 'competitive-intelligence/**'
      - '*.bat'
      - '.github/workflows/cie-tests.yml'
  push:
    branches: [main, 'feature/cie-offline-first']
    paths:
      - 'competitive-intelligence/**'
      - '*.bat'
      - '.github/workflows/cie-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: competitive-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: competitive-intelligence/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
